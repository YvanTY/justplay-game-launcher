[package]
name = "game-launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
sdl3-sys = { version = "0.7.2", default-features = false }
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
