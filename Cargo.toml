[package]
name = "game-launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
sdl3-sys = { version = "0.7.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg"] }
toml = "1.1.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
